<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-responsive.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-responsive-hotfix.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-adaptive-config.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-adaptive-fit.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/development-editorial.css' | relative_url }}">
</head>
<body class="dlmt-page">
  <a class="dlmt-skip-link" href="#main-content">Перейти к содержанию</a>
  {% include development-header.html %}
  <aside class="dlmt-side-nav" data-side-nav aria-label="Разделы страницы">
    <nav class="dlmt-side-nav__panel" aria-label="Навигация по разделам">
      <a href="#profile" data-side-nav-link><strong>PROFILE</strong><span class="dlmt-side-nav__marker" aria-hidden="true"></span></a>
      <a href="#skills" data-side-nav-link><strong>SKILLS</strong><span class="dlmt-side-nav__marker" aria-hidden="true"></span></a>

      <a href="#experience" data-side-nav-link><strong>EXPERIENCE</strong><span class="dlmt-side-nav__marker" aria-hidden="true"></span></a>
      <a href="#contacts" data-side-nav-link><strong>CONTACTS</strong><span class="dlmt-side-nav__marker" aria-hidden="true"></span></a>
    </nav>
  </aside>
  <main id="main-content" class="dlmt-main">{{ content }}</main>
  <script src="{{ '/assets/js/development-responsive-mode.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/development-adaptive-fit.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/development.js' | relative_url }}"></script>
</body>
</html>
