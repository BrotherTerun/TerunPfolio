<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Merriweather:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm-responsive.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm-landing.css' | relative_url }}">

  <style>
    :root {
      --gm-landing-header-shade: rgba(2, 16, 19, .58);
      --gm-landing-transition-glow-qa: rgba(44, 177, 157, .34);
      --gm-landing-contact-dark-a57: rgba(1, 14, 17, .57);
      --gm-landing-contact-dark-a73: rgba(1, 14, 17, .73);
      --gm-landing-contact-teal-a18: rgba(6, 77, 75, .18);
    }

    /* Keep the header in the same petrol family as the landing, but visibly
       darker so it reads as a stable navigation layer above the sections. */
    body.gm-page .gm-header {
      border-bottom: 1px solid var(--gm-gold-a19);
      background:
        linear-gradient(var(--gm-landing-header-shade), var(--gm-landing-header-shade)),
        radial-gradient(circle at 16% 0%, var(--gm-landing-teal-glow), var(--gm-transparent) 30%),
        linear-gradient(90deg, var(--gm-landing-petrol-deep), var(--gm-landing-petrol) 48%, var(--gm-landing-petrol-deep));
      box-shadow: 0 10px 34px var(--gm-black-a12);
    }

    body.gm-page .gm-social-link {
      background: var(--gm-teal-a08);
    }

    body.gm-page .gm-social-link:hover,
    body.gm-page .gm-social-link:focus-visible {
      background: var(--gm-landing-petrol-soft);
    }

    body.gm-page .gm-footer {
      border-top-color: var(--gm-gold-a19);
      background: var(--gm-landing-petrol-deep);
    }

    /* The systems rail must sit fully inside the first screen instead of being
       swallowed by the section seam. Give the hero a small amount of extra
       vertical room and lift the rail away from the boundary. */
    @media (min-width: 961px) {
      .gm-hero--profile {
        min-height: calc(var(--gm-viewport-fit) + 28px);
      }

      .gm-hero-profile {
        padding-bottom: 124px;
      }

      .gm-hero-systems {
        bottom: 18px;
      }
    }

    /* Section seams are overlays only. Neighbouring backgrounds remain visible
       beneath a stronger teal-to-transparent glow and the gold geometry. */
    .gm-transition,
    .gm-transition--dark-paper,
    .gm-transition--paper-dark,
    .gm-transition--dark-dark {
      background:
        radial-gradient(
          ellipse at center,
          var(--gm-landing-transition-glow-qa) 0%,
          var(--gm-landing-teal-glow) 34%,
          var(--gm-transparent) 72%
        );
    }

    .gm-transition::before {
      box-shadow:
        0 0 22px var(--gm-gold-a22),
        0 0 42px var(--gm-landing-transition-glow-qa);
    }

    .gm-transition::after,
    .gm-transition--dark-paper::after,
    .gm-transition--paper-dark::after,
    .gm-transition--dark-dark::after {
      background: var(--gm-transparent);
      box-shadow:
        0 0 16px var(--gm-gold-a19),
        0 0 28px var(--gm-landing-transition-glow-qa);
    }

    /* Reviews are one centered composition: heading + rail + pagination.
       Inactive cards keep their full layout width so the rail geometry stays
       exactly 15% previous / 70% active / 15% next. */
    .gm-review-slide {
      transform: translateY(8px);
    }

    .gm-review-slide.is-active {
      transform: translateY(0);
    }

    @media (min-width: 961px) {
      .gm-section--reviews {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: clamp(72px, 8dvh, 96px);
        padding-bottom: clamp(72px, 8dvh, 96px);
      }

      .gm-review-carousel__shell {
        min-height: calc(var(--gm-viewport-fit) - 168px);
        margin-inline: auto;
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: stretch;
      }

      .gm-review-carousel__heading {
        margin-top: 0;
        margin-bottom: clamp(24px, 3dvh, 34px);
      }

      .gm-review-carousel__stage {
        width: 100%;
        margin-inline: auto;
      }

      .gm-review-slide {
        min-height: clamp(400px, 48dvh, 520px);
      }
    }

    /* Extend media/shade a few pixels past the nominal poster bounds to avoid
       antialiasing seams at the section dividers. The overlay itself is darker
       in hue, but about fifteen percentage points more transparent than before. */
    .gm-contact__media,
    .gm-contact__shade {
      inset: -4px 0;
    }

    .gm-contact__shade {
      background:
        linear-gradient(
          90deg,
          var(--gm-landing-contact-dark-a73) 0%,
          var(--gm-landing-contact-dark-a57) 35%,
          var(--gm-landing-contact-teal-a18) 62%,
          var(--gm-landing-contact-dark-a57) 100%
        ),
        linear-gradient(
          180deg,
          var(--gm-landing-contact-dark-a57) 0%,
          var(--gm-transparent) 42%,
          var(--gm-landing-contact-dark-a73) 100%
        ),
        radial-gradient(
          circle at 72% 46%,
          var(--gm-landing-teal-glow),
          var(--gm-transparent) 34%
        );
    }
  </style>
</head>

<body class="gm-page">
  <a class="gm-skip-link" href="#main-content">Перейти к содержанию</a>

  {% include gm-header.html %}

  <main id="main-content" class="gm-main">
    {{ content }}
  </main>

  <footer class="gm-footer">
    <div class="gm-container gm-footer__inner">
      <p>Терун · Ведущий НРИ</p>
      <a href="{{ '/' | relative_url }}">Вернуться в портфолио</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/gm-adaptive-fit.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/gm-landing.js' | relative_url }}" defer></script>
</body>
</html>
