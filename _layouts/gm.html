<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Merriweather:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm-responsive.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/gm-landing.css' | relative_url }}">

  <style>
    :root {
      --gm-landing-header-shade: rgba(2, 16, 19, .58);
      --gm-landing-transition-glow-qa: rgba(44, 177, 157, .34);
      --gm-landing-contact-dark-a57: rgba(1, 14, 17, .57);
      --gm-landing-contact-dark-a73: rgba(1, 14, 17, .73);
      --gm-landing-contact-teal-a18: rgba(6, 77, 75, .18);
    }

    /* gm-landing.css deliberately lets several presentation layers overflow
       vertically. Keep that behaviour, but clip the horizontal axis so scaled
       media, carousel rails and decorative transforms never enlarge the page's
       scrollable width. */
    html,
    body.gm-page {
      max-width: 100%;
      overflow-x: clip;
    }

    body.gm-page .gm-main {
      max-width: 100%;
      overflow-x: clip;
      overflow-y: visible;
    }

    /* Keep the header in the same petrol family as the landing, but visibly
       darker so it reads as a stable navigation layer above the sections. */
    body.gm-page .gm-header {
      border-bottom: 1px solid var(--gm-gold-a19);
      background:
        linear-gradient(var(--gm-landing-header-shade), var(--gm-landing-header-shade)),
        radial-gradient(circle at 16% 0%, var(--gm-landing-teal-glow), var(--gm-transparent) 30%),
        linear-gradient(90deg, var(--gm-landing-petrol-deep), var(--gm-landing-petrol) 48%, var(--gm-landing-petrol-deep));
      box-shadow: 0 10px 34px var(--gm-black-a12);
    }

    body.gm-page .gm-social-link {
      background: var(--gm-teal-a08);
    }

    body.gm-page .gm-social-link:hover,
    body.gm-page .gm-social-link:focus-visible {
      background: var(--gm-landing-petrol-soft);
    }

    /* Footer uses the same darker petrol layer as the header so the page ends
       inside the same visual shell it starts with. */
    body.gm-page .gm-footer {
      border-top-color: var(--gm-gold-a19);
      background:
        linear-gradient(var(--gm-landing-header-shade), var(--gm-landing-header-shade)),
        radial-gradient(circle at 84% 100%, var(--gm-landing-teal-glow), var(--gm-transparent) 30%),
        linear-gradient(90deg, var(--gm-landing-petrol-deep), var(--gm-landing-petrol) 48%, var(--gm-landing-petrol-deep));
      box-shadow: 0 -10px 34px var(--gm-black-a12);
    }

    body.gm-page .gm-footer__inner p {
      color: var(--gm-muted);
    }

    body.gm-page .gm-footer__inner a {
      color: var(--gm-text);
      text-decoration: none;
      transition: color .18s ease;
    }

    body.gm-page .gm-footer__inner a:hover,
    body.gm-page .gm-footer__inner a:focus-visible {
      color: var(--gm-gold);
    }

    /* The portrait itself now owns the full visual frame. The former glass
       backing keeps its existing geometry but contributes no padding, panel,
       border or blur, so the artwork expands to exactly that outer size. */
    .gm-hero-profile__identity {
      padding: 0;
      border: 0;
      background: var(--gm-transparent);
      box-shadow: none;
      backdrop-filter: none;
    }

    .gm-hero-profile__portrait {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 1px solid var(--gm-gold-a19);
      box-shadow: 0 0 70px var(--gm-landing-teal-glow);
    }

    /* The systems rail must sit fully inside the first screen instead of being
       swallowed by the section seam. Give the hero a small amount of extra
       vertical room and lift the rail away from the boundary. */
    @media (min-width: 961px) {
      .gm-hero--profile {
        min-height: calc(var(--gm-viewport-fit) + 28px);
      }

      .gm-hero-profile {
        padding-bottom: 124px;
      }

      .gm-hero-systems {
        bottom: 18px;
      }
    }

    /* Section seams are overlays only. Neighbouring backgrounds remain visible
       beneath a stronger teal-to-transparent glow and the gold geometry. */
    .gm-transition,
    .gm-transition--dark-paper,
    .gm-transition--paper-dark,
    .gm-transition--dark-dark {
      background:
        radial-gradient(
          ellipse at center,
          var(--gm-landing-transition-glow-qa) 0%,
          var(--gm-landing-teal-glow) 34%,
          var(--gm-transparent) 72%
        );
    }

    .gm-transition::before {
      height: 2px;
      background: linear-gradient(
        90deg,
        var(--gm-gold-clear) 0%,
        var(--gm-gold-a44) 16%,
        var(--gm-gold) 50%,
        var(--gm-gold-a44) 84%,
        var(--gm-gold-clear) 100%
      );
      box-shadow:
        0 0 22px var(--gm-gold-a22),
        0 0 42px var(--gm-landing-transition-glow-qa);
    }

    .gm-transition::after,
    .gm-transition--dark-paper::after,
    .gm-transition--paper-dark::after,
    .gm-transition--dark-dark::after {
      width: 12px;
      height: 12px;
      border-color: var(--gm-gold);
      background: var(--gm-gold);
      box-shadow:
        0 0 16px var(--gm-gold-a22),
        0 0 30px var(--gm-landing-transition-glow-qa);
    }

    /* Catalogue cards now treat the entire dossier as the details link. Keep
       the booking button above the stretched link so both actions remain
       distinct, and remove the old decorative archive label entirely. */
    .gm-game-card {
      cursor: pointer;
    }

    .gm-game-card__body::before {
      content: none;
      display: none;
    }

    .gm-game-card__link {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: block;
    }

    .gm-game-card__link:focus-visible {
      outline: 2px solid var(--gm-teal);
      outline-offset: -4px;
    }

    .gm-game-card__media,
    .gm-game-card__body {
      position: relative;
      z-index: 1;
    }

    .gm-game-card__facts > div:last-child {
      grid-column: 1 / -1;
    }

    .gm-game-card__actions--signup-only {
      justify-content: flex-end;
    }

    .gm-game-card__signup {
      position: relative;
      z-index: 6;
    }

    /* The table section uses the image itself as the visual surface. Remove
       the two large glass panels, keep both columns equal in height and let
       their internal content occupy the available vertical space evenly. */
    @media (min-width: 961px) {
      .gm-table__content {
        align-items: stretch;
        align-content: stretch;
      }

      .gm-table__column {
        height: 100%;
        min-height: 0;
        padding: 0 clamp(10px, 1.2vw, 20px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        border: 0;
        background: var(--gm-transparent);
        box-shadow: none;
        backdrop-filter: none;
      }

      .gm-table__column--principles,
      .gm-table__column--requirements {
        border-color: var(--gm-transparent);
        background: var(--gm-transparent);
      }

      .gm-table__column .gm-section__heading {
        margin-bottom: clamp(20px, 2.8dvh, 32px);
      }

      .gm-table__column--principles .gm-principles {
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }

      .gm-table__column--principles .gm-principles article {
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(12px, 1.8dvh, 20px) 0;
      }

      .gm-table__column--requirements .gm-feature-grid {
        min-height: 0;
        height: 100%;
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }

      .gm-table__column--requirements .gm-feature-grid article {
        min-height: 0;
        height: 100%;
        justify-content: center;
      }
    }

    /* Reviews are one centered composition: heading + rail + pagination.
       Inactive cards keep their full layout width so the rail geometry stays
       exactly 15% previous / 70% active / 15% next. */
    .gm-review-slide {
      transform: translateY(8px);
    }

    .gm-review-slide.is-active {
      transform: translateY(0);
    }

    /* During the invisible clone -> real-slide loop reset, freeze each card as
       well as the rail. Otherwise the active class swaps with a .5s vertical
       transition and produces a tiny up/down twitch at the loop boundary. */
    .gm-review-carousel__track.is-jumping .gm-review-slide {
      transition: none !important;
    }

    @media (min-width: 961px) {
      .gm-section--reviews {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: clamp(72px, 8dvh, 96px);
        padding-bottom: clamp(72px, 8dvh, 96px);
      }

      .gm-review-carousel__shell {
        min-height: calc(var(--gm-viewport-fit) - 168px);
        margin-inline: auto;
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: center;
        justify-items: stretch;
      }

      .gm-review-carousel__heading {
        margin-top: 0;
        margin-bottom: clamp(24px, 3dvh, 34px);
      }

      .gm-review-carousel__stage {
        width: 100%;
        margin-inline: auto;
      }

      .gm-review-slide {
        min-height: clamp(400px, 48dvh, 520px);
      }
    }

    /* The image, shade and contact section now share the exact same bounds.
       No overscan or media scaling: section transitions sit on the real edge
       of the poster instead of exposing a narrow mismatched strip. */
    .gm-contact {
      overflow: hidden;
    }

    .gm-contact__media,
    .gm-contact__shade {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .gm-contact__media {
      transform: none;
    }

    .gm-contact__shade {
      background:
        linear-gradient(
          90deg,
          var(--gm-landing-contact-dark-a73) 0%,
          var(--gm-landing-contact-dark-a57) 35%,
          var(--gm-landing-contact-teal-a18) 62%,
          var(--gm-landing-contact-dark-a57) 100%
        ),
        linear-gradient(
          180deg,
          var(--gm-landing-contact-dark-a57) 0%,
          var(--gm-transparent) 42%,
          var(--gm-landing-contact-dark-a73) 100%
        ),
        radial-gradient(
          circle at 72% 46%,
          var(--gm-landing-teal-glow),
          var(--gm-transparent) 34%
        );
    }

    /* Final CTA keeps only the headline and a compact set of equal contact
       actions. Telegram remains the primary path while Discord and VK retain
       the same contact semantics as the header. */
    .gm-contact-links {
      margin-top: clamp(26px, 3.6dvh, 38px);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gm-contact-link {
      position: relative;
      min-width: 172px;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 22px;
      border: 1px solid var(--gm-gold-a44);
      border-radius: 2px;
      background: var(--gm-landing-panel);
      color: var(--gm-text) !important;
      font-family: var(--gm-font-body);
      font-size: var(--gm-font-size-button);
      font-weight: 700;
      letter-spacing: var(--gm-letter-ui);
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 12px 32px var(--gm-black-a12);
      backdrop-filter: blur(10px);
      transition: transform .18s ease, border-color .18s ease, background-color .18s ease, color .18s ease;
    }

    .gm-contact-link svg {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
    }

    .gm-contact-link--telegram svg,
    .gm-contact-link--discord svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gm-contact-link--vk svg {
      fill: currentColor;
    }

    .gm-contact-link--primary {
      border-color: var(--gm-gold);
      background: var(--gm-gold);
      color: var(--gm-button-text) !important;
      box-shadow:
        inset 0 0 0 1px var(--gm-white-a28),
        0 12px 32px var(--gm-black-a12);
    }

    .gm-contact-link:hover,
    .gm-contact-link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gm-gold);
      background: var(--gm-landing-petrol-soft);
      color: var(--gm-gold) !important;
    }

    .gm-contact-link--primary:hover,
    .gm-contact-link--primary:focus-visible {
      background: var(--gm-button-hover);
      color: var(--gm-button-text) !important;
    }

    .gm-contact-link__toast {
      position: absolute;
      left: 50%;
      top: calc(100% + 10px);
      width: max-content;
      padding: 6px 9px;
      border: 1px solid var(--gm-gold-a19);
      background: var(--gm-landing-panel-strong);
      color: var(--gm-text);
      font-size: var(--gm-font-size-label-xs);
      font-weight: 400;
      letter-spacing: .04em;
      line-height: 1.2;
      text-transform: none;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -4px);
      transition: opacity 50ms linear, transform 120ms ease;
    }

    .gm-contact-link.is-copied .gm-contact-link__toast {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .gm-contact-link.is-copy-failed .gm-contact-link__toast {
      color: var(--gm-muted);
    }
  </style>
</head>

<body class="gm-page">
  <a class="gm-skip-link" href="#main-content">Перейти к содержанию</a>

  {% include gm-header.html %}

  <main id="main-content" class="gm-main">
    {{ content }}
  </main>

  <footer class="gm-footer">
    <div class="gm-container gm-footer__inner">
      <p>Copyright © 2026 Tereshenko Leonid. All rights reserved.</p>
      <a href="#portfolio-coming-soon">чем ещё я занимаюсь?</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/gm-adaptive-fit.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/gm-landing.js' | relative_url }}" defer></script>
</body>
</html>
