- quote: "Терун даёт отличную возможность погрузится в своего персонажа и его драму при этом не забывая про важные механические аспекты. На его играх отлично чувствуется сеттинг в котором он водит, от стандартного ДнД, до серьезного Ведьмака и колорита Легенды Пяти Колец. Погружение в лор и атмосферу сто процентное. Лично я остался доволен всеми сюжетными линиями в которых участвовал."
  author: "RomaBOSS"
  context: "Плата Мильтора / Эхо Теней · Witcher TTRPG/L5R: AiR"

- quote: "Играл у Теруна три раза. Дважды ваншоты, один раз небольшой кампейн. Все три очень отличались как по сеттингу, так и настроению. Каждый раз мастер очень увлечён игрой, и проводит масштабную подготовку, как лично, так и с игроками. От всех игр получил много весёлых моментов. Однозначно могу порекомендовать Теруна как ведущего."
  author: "NecrosCheremore"
  context: "Секреты Лейнхолта / Страх, что не увидеть · Witcher TTRPG / D&D 5ed"

- quote: "[Здесь будет отзыв, который показывает конкретное сильное качество ведущего.]"
  author: "Имя игрока"
  context: "Кампания / ваншот · система"
